# Personal Finance Backend Configuration

spring.application.name=personal-finance-backend

# Server
server.port=8080
server.servlet.context-path=/api

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:personal_finance_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional - for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-use-at-least-256-bit-key
jwt.expiration=3600000

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.token.uri=https://oauth2.googleapis.com/token
google.tokeninfo.uri=https://www.googleapis.com/oauth2/v3/tokeninfo

# Logging
logging.level.root=INFO
logging.level.com.pocketwatch=DEBUG
logging.level.org.springframework.security=DEBUG
